name: 'Open an Issue for New Code Scanning Alerts'

# Alert #3 (the CORS header-injection finding, py/http-response-splitting)
# sat in the Security tab until someone happened to go look. This opens a
# tracking issue automatically for any open CodeQL alert on TrenTorch-Dev
# (the default branch) that doesn't already have one. Dedups against
# existing open "security" issues so a re-run doesn't spam duplicates for
# the same alert number.
#
# Issue #454 (tornado's CVE, fixed by #480) sat open for a full cycle
# after the alert itself had already cleared, because this workflow only
# ever created issues and never closed one -- the alert is the source of
# truth, so a tracking issue that outlives its alert is a lie. This also
# closes the tracking issue for any alert that's no longer open (fixed or
# dismissed), so a merged fix reliably cleans up after itself.
#
# Originally triggered by the `code_scanning_alert` webhook event, but
# that failed to schedule on every single push (13/13 failures, confirmed
# via the Actions run history) -- GitHub Free-tier orgs have known gaps
# in support for that specific event as an Actions trigger. A scheduled
# poll against the code-scanning/alerts API sidesteps that entirely and
# is directly testable via workflow_dispatch, unlike a trigger that fails
# silently.
#
# Forks ship with the Issues feature disabled, and every issues write
# (create, comment, close) then fails with HTTP 410 "Issues has been
# disabled in this repository" -- unhandled, it turned every scheduled
# run red on this fork starting the day the first CodeQL alert appeared
# (Oct 31), while the read endpoints kept working and hid the cause.
# The workflow now checks `has_issues` up front and, when disabled, logs
# the untracked-alert summary to the run output and exits green: the
# alert page stays the source of truth, and CI stops crying about a
# feature this repo deliberately doesn't have.

on:
  schedule:
    - cron: '17 */6 * * *'  # every 6 hours, minute offset from :00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  open-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Forks have Issues disabled by default; every issues write
            // below would 410. Degrade to a log-only run instead of
            // failing the schedule (which mutes alerting entirely, since
            // broken schedules get auto-disabled after 60 days).
            const { data: repoMeta } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const issuesEnabled = repoMeta.has_issues;

            const { data: openAlerts } = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              ref: "refs/heads/TrenTorch-Dev",
            });

            if (!issuesEnabled) {
              if (openAlerts.length === 0) {
                console.log("No open code scanning alerts and Issues are disabled; nothing to do.");
                return;
              }
              for (const alert of openAlerts) {
                const rule = alert.rule || {};
                console.log(`::notice::CodeQL alert #${alert.number} open (${rule.id}, ${rule.security_severity_level || "unknown"}): ${alert.html_url} -- tracking issues skipped because Issues are disabled on this repo.`);
              }
              return;
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security",
            });

            const markerRe = /CodeQL alert #(\d+)/;
            const openAlertNumbers = new Set(openAlerts.map((a) => a.number));

            // Close any tracking issue whose alert is no longer open (fixed or
            // dismissed) -- the alert, not the issue, is the source of truth.
            for (const issue of openIssues) {
              const match = markerRe.exec(issue.title) || markerRe.exec(issue.body || "");
              if (!match) continue;
              const alertNumber = Number(match[1]);
              if (openAlertNumbers.has(alertNumber)) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `CodeQL alert #${alertNumber} is no longer open (fixed or dismissed). Closing this tracking issue automatically.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`CodeQL alert #${alertNumber}: closed stale tracking issue #${issue.number}.`);
            }

            if (openAlerts.length === 0) {
              console.log("No open code scanning alerts on TrenTorch-Dev.");
              return;
            }

            const alreadyTracked = (marker) =>
              openIssues.some((i) => i.title.includes(marker) || (i.body || "").includes(marker));

            for (const alert of openAlerts) {
              const marker = `CodeQL alert #${alert.number}`;
              if (alreadyTracked(marker)) {
                console.log(`${marker}: already tracked, skipping.`);
                continue;
              }

              const rule = alert.rule || {};
              const loc = alert.most_recent_instance?.location || {};
              const severity = rule.security_severity_level || rule.severity || "unknown";

              const title = `Security: ${rule.description || rule.id} (${marker})`;
              const body = [
                `An open CodeQL code scanning alert on \`main\` has no tracking issue yet.`,
                ``,
                `**Rule:** \`${rule.id}\` (severity: ${severity})`,
                `**Location:** \`${loc.path || "unknown"}\`${loc.start_line ? `:${loc.start_line}` : ""}`,
                `**Alert:** ${alert.html_url}`,
                ``,
                rule.full_description || rule.description || "",
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security"],
              });
              console.log(`${marker}: opened a new tracking issue.`);
            }
